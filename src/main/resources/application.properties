# ==================== App ====================
app.frontend.url=http://localhost:5021
app.invite.expiration-days=7
# Event type (events_types.id) given to events created without one, such as those of the admin panel, so the mobile app
# (which lists events by type) still shows them. Leave it empty to give them none.
app.events.default-event-type-id=30ab7965-8990-46b1-a6b0-71377b62655f
# Creates the event format catalog (every structure and ida/vuelta/third-place combination) on startup if missing.
# A deleted format comes back on the next startup, so set this to false once the catalog is trimmed.
app.seed.event-formats.enabled=true

# ==================== Security ====================
# UUID (id) of the "roles" row that grants admin access. Login/authorities check
# this id directly — never the role's display name, since names can be edited.
app.security.admin-role-id=4fd36dd3-c40a-4063-9e88-fed84872564f
# Length of the temporary password emailed to users created from the admin panel (minimum 8).
app.security.temporary-password-length=12

# ==================== Flyway ====================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.matches.default-duration-minutes=60
app.matches.default-break-minutes=15
app.matches.auto-finish-interval-ms=60000
