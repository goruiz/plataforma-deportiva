spring.application.name=backend
spring.profiles.active=dev
spring.datasource.url=jdbc:postgresql://localhost:5432/sports_platform
spring.datasource.username=postgres
spring.datasource.password=Lucamby0803
spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL plans a prepared statement once and, after a few runs, may reuse that "generic" plan for every value. The
# organization filter (`? = true OR organization_id = ?`) is unreadable to a generic plan, which scans and sorts a whole
# table (measured with 500 000 accounts: 230 ms for the users page against 1 ms planned with the real values). Planning
# each run with its values costs a fraction of a millisecond and keeps every filtered list on its indexes.
spring.datasource.hikari.connection-init-sql=SET plan_cache_mode = force_custom_plan

# Flyway (db/migration) is the only owner of the schema: Hibernate just checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

