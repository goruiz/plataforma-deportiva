# ==================== Security ====================
# The only browsers allowed to call the API: the addresses where the panel and the web app are served. Change them
# to the real domains before deploying; a site not listed here is refused by the browser.
app.cors.allowed-origin-patterns=https://admin.sports-platform.com,https://app.sports-platform.com

# ==================== Swagger / OpenAPI ====================
# The API documentation is not published in production: it lists every endpoint to anyone, with no session.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==================== Flyway ====================
# Production never gets the demo accounts (admin@algo.com, usuario@algo.com): create the first administrator by hand.
spring.flyway.placeholders.seed_demo_users=false
