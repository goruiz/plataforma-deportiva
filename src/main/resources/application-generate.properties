# ============================================================
# Perfil "generate" — genera el DDL de todas las entidades
# a un archivo SQL sin tocar la base de datos.
#
# USO:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=generate
#
# Resultado: src/main/resources/db/migration/generated-schema.sql
# Luego renombra ese archivo como el siguiente migration:
#   V2__create_teams_table.sql  (o el número que corresponda)
# ============================================================

# Flyway no corre en este perfil
spring.flyway.enabled=false

# Hibernate no modifica la BD, solo genera el SQL al archivo
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=./src/main/resources/db/migration/generated-schema.sql
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
