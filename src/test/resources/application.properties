spring.application.name=backend
# Only BackendApplicationTests opens a real context against a database; it reads the same .env as the app.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sports_platform}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# Tests that open the context do not run the migrations (they need the Flyway placeholders from the main properties).
spring.flyway.enabled=false
spring.jpa.show-sql=true

# ==================== JWT Configuration ====================
jwt.secret=${JWT_SECRET:test-only-secret-key-long-enough-for-hmac-sha-256-signing}
jwt.expiration=86400000