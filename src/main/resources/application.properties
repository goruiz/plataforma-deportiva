# ==================== Paginated lists ====================
# Records per page when the client sends no size, the largest size it may ask for (a bigger one is a 400, so a single
# request can never read a whole table), and how long a search may be and how many of its words are used.
app.pagination.default-size=20
app.pagination.max-size=100
app.pagination.max-search-length=100
app.pagination.max-search-terms=5

# ==================== Menu ====================
# How many levels the menu may have (a top-level item is level 1). The panel repeats this number in MENU_LIMITS.
app.menu.max-depth=5

# ==================== Security ====================
# UUID (id) of the "roles" row that grants admin access. Login/authorities check
# this id directly — never the role's display name, since names can be edited.
app.security.admin-role-id=4fd36dd3-c40a-4063-9e88-fed84872564f
# UUID (id) of the "roles" row "Propietario": the platform owner (the system's seller), who sees every organization. As with
# the admin role it is checked by id, never by name. It is independent of the admin role (the customers' administrators):
# the owner does not hold that one and gets into the panel with this role alone.
app.security.owner-role-id=f0a08d14-89f2-41a0-9d28-fcc53dfb65b3
# UUID (id) of the "roles" row "Usuario": the third platform role (after Propietario and Administrador), the one every
# account gets when it registers from the mobile app. It carries the app's menu in roles_menu (V13); an account with no
# role at all sees an empty menu.
app.security.mobile-user-role-id=b8c43bd5-efed-4863-bdf2-6baa023eae0c
# Length of the temporary password emailed to users created from the admin panel (minimum 8).
app.security.temporary-password-length=12
app.security.password-reset-expiration-minutes=30
app.mobile.deep-link-scheme=sportplatform

# ==================== Flyway ====================
# Every table and every seed lives in db/migration; never create schema or data with scripts or runners.
# On every startup Flyway applies the pending migrations before Hibernate validates the entities. The app does not start
# if a migration fails, if one already applied was edited (validate-on-migrate) or if the folder is missing.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.fail-on-missing-locations=true
# A database that already has tables but no flyway_schema_history is taken as version 0, so V1 (idempotent) completes it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Values the migrations read as ${name}. The admin role id is the same one the login checks.
spring.flyway.placeholders.admin_role_id=${app.security.admin-role-id}
spring.flyway.placeholders.owner_role_id=${app.security.owner-role-id}
spring.flyway.placeholders.mobile_user_role_id=${app.security.mobile-user-role-id}
# 'true' creates the demo accounts (admin@algo.com, usuario@algo.com) in V1; the prd profile turns it off.
spring.flyway.placeholders.seed_demo_users=true
app.matches.default-duration-minutes=60
app.matches.default-break-minutes=15
app.matches.auto-finish-interval-ms=60000
